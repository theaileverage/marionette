<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marionette controller and worker CLI workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;padding:48px 32px;background:#f5f5f5;color:#2d3142;font-family:Geist,system-ui,sans-serif}main{width:100%;max-width:1200px;margin:auto}.eyebrow{margin:0 0 8px;color:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 24px;font:400 32px 'Instrument Serif',serif;letter-spacing:-.02em}svg{display:block;width:100%;min-width:960px;height:auto}.lane{fill:rgba(45,49,66,.025);stroke:rgba(45,49,66,.12);stroke-width:1}.lane-title{fill:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.14em}.node{fill:#fff;stroke:#2d3142;stroke-width:1}.node-focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.node-store{fill:rgba(45,49,66,.05);stroke:#4f5d75;stroke-width:1}.node-optional{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.32);stroke-dasharray:4 4;stroke-width:1}.tag{fill:none;stroke:rgba(45,49,66,.32);stroke-width:.8}.tag-accent{fill:none;stroke:rgba(235,108,54,.64);stroke-width:.8}.tag-text{fill:#4f5d75;font:500 8px 'Geist Mono',monospace;letter-spacing:.06em}.tag-text-accent{fill:#eb6c36;font:500 8px 'Geist Mono',monospace;letter-spacing:.06em}.name{fill:#2d3142;font:600 12px Geist,system-ui,sans-serif}.sub{fill:#4f5d75;font:400 8px 'Geist Mono',monospace}.flow{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#arrow)}.flow-accent{fill:none;stroke:#eb6c36;stroke-width:1.2;marker-end:url(#arrow-accent)}.flow-dash{fill:none;stroke:#7a8399;stroke-width:1;stroke-dasharray:4 4}.note{fill:#7a8399;font:italic 12px 'Instrument Serif',serif}.legend{fill:#4f5d75;font:400 8px 'Geist Mono',monospace;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Vertical swimlane · CLI-only v1</p>
    <h1>Controller and worker coordination through Marionette</h1>
    <svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="controller-worker-marionette-workflow-title controller-worker-marionette-workflow-desc">
      <title id="controller-worker-marionette-workflow-title">Controller and worker coordination through Marionette CLI</title>
      <desc id="controller-worker-marionette-workflow-desc">Vertical ownership lanes show a controller creating and admitting work, durable SQLite state holding jobs and the board inbox, a project watcher delivering wakeups, and a worker reading messages and recording results through CLI commands. Marionette v1 has no HTTP coordinator.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1200" height="820" fill="#f5f5f5"/>

      <rect class="lane" x="32" y="48" width="256" height="704" rx="8"/>
      <rect class="lane" x="304" y="48" width="288" height="704" rx="8"/>
      <rect class="lane" x="608" y="48" width="256" height="704" rx="8"/>
      <rect class="lane" x="880" y="48" width="288" height="704" rx="8"/>
      <text class="lane-title" x="48" y="72">CONTROLLER</text>
      <text class="lane-title" x="320" y="72">MARIONETTE CLI + SQLITE</text>
      <text class="lane-title" x="624" y="72">PROJECT WATCHER</text>
      <text class="lane-title" x="896" y="72">WORKER AGENT</text>

      <!-- Workflow connectors are drawn first. -->
      <path class="flow-accent" d="M160 192 H328 Q336 192 336 200"/>
      <path class="flow" d="M256 264 H336"/>
      <path class="flow" d="M448 288 V304 Q448 312 456 312 H680"/>
      <path class="flow-accent" d="M768 368 V428 Q768 436 776 436 H952"/>
      <path class="flow" d="M1048 496 V536"/>
      <path class="flow" d="M952 580 H560"/>
      <path class="flow" d="M1048 624 V640"/>
      <path class="flow" d="M1048 720 V736 Q1048 744 1040 744 H168 Q160 744 160 736 V712"/>

      <rect class="node-focal" x="64" y="104" width="192" height="88" rx="6"/>
      <rect class="tag-accent" x="72" y="112" width="48" height="12" rx="2"/>
      <text class="tag-text-accent" x="96" y="121" text-anchor="middle">CREATE</text>
      <text class="name" x="160" y="144" text-anchor="middle">Create a job</text>
      <text class="sub" x="160" y="164" text-anchor="middle">marionette job create</text>
      <text class="sub" x="160" y="180" text-anchor="middle">--json job.json</text>

      <rect class="node" x="64" y="200" width="192" height="120" rx="6"/>
      <rect class="tag" x="72" y="208" width="48" height="12" rx="2"/>
      <text class="tag-text" x="96" y="217" text-anchor="middle">ADMIT</text>
      <text class="name" x="160" y="240" text-anchor="middle">Reserve and start</text>
      <text class="sub" x="160" y="260" text-anchor="middle">marionette attempt admit</text>
      <text class="sub" x="160" y="276" text-anchor="middle">--json attempt.json</text>
      <text class="sub" x="160" y="292" text-anchor="middle">marionette attempt start</text>
      <text class="sub" x="160" y="308" text-anchor="middle">--json start.json</text>

      <rect class="node" x="64" y="624" width="192" height="88" rx="6"/>
      <rect class="tag" x="72" y="632" width="48" height="12" rx="2"/>
      <text class="tag-text" x="96" y="641" text-anchor="middle">DECIDE</text>
      <text class="name" x="160" y="664" text-anchor="middle">Accept or reject</text>
      <text class="sub" x="160" y="684" text-anchor="middle">marionette result decide</text>
      <text class="sub" x="160" y="700" text-anchor="middle">--json decision.json</text>

      <rect class="node-store" x="336" y="168" width="224" height="120" rx="6"/>
      <rect class="tag" x="344" y="176" width="48" height="12" rx="2"/>
      <text class="tag-text" x="368" y="185" text-anchor="middle">STATE</text>
      <text class="name" x="448" y="216" text-anchor="middle">Durable project state</text>
      <text class="sub" x="448" y="236" text-anchor="middle">jobs · attempts · effect claims · results</text>
      <text class="sub" x="448" y="252" text-anchor="middle">SQLite is the authority</text>

      <rect class="node-store" x="336" y="424" width="224" height="184" rx="6"/>
      <rect class="tag" x="344" y="432" width="48" height="12" rx="2"/>
      <text class="tag-text" x="368" y="441" text-anchor="middle">BOARD</text>
      <text class="name" x="448" y="472" text-anchor="middle">Durable message board</text>
      <text class="sub" x="448" y="492" text-anchor="middle">append-only posts + subscriptions</text>
      <text class="sub" x="448" y="508" text-anchor="middle">per-session cursors</text>
      <text class="name" x="448" y="544" text-anchor="middle">Inbox = board read view</text>
      <text class="sub" x="448" y="564" text-anchor="middle">marionette board inbox</text>
      <text class="sub" x="448" y="580" text-anchor="middle">then board mark-read</text>

      <rect class="node" x="680" y="304" width="176" height="64" rx="6"/>
      <rect class="tag" x="688" y="312" width="56" height="12" rx="2"/>
      <text class="tag-text" x="716" y="321" text-anchor="middle">WATCH</text>
      <text class="name" x="768" y="344" text-anchor="middle">Wake + reconcile</text>
      <text class="sub" x="768" y="360" text-anchor="middle">marionette watch</text>

      <rect class="node-focal" x="952" y="384" width="192" height="112" rx="6"/>
      <rect class="tag-accent" x="960" y="392" width="40" height="12" rx="2"/>
      <text class="tag-text-accent" x="980" y="401" text-anchor="middle">READ</text>
      <text class="name" x="1048" y="432" text-anchor="middle">Subscribe, then catch up</text>
      <text class="sub" x="1048" y="452" text-anchor="middle">marionette board subscribe</text>
      <text class="sub" x="1048" y="468" text-anchor="middle">--thread-id THREAD</text>
      <text class="sub" x="1048" y="484" text-anchor="middle">marionette board inbox</text>

      <rect class="node" x="952" y="536" width="192" height="88" rx="6"/>
      <rect class="tag" x="960" y="544" width="40" height="12" rx="2"/>
      <text class="tag-text" x="980" y="553" text-anchor="middle">POST</text>
      <text class="name" x="1048" y="576" text-anchor="middle">Share finding or question</text>
      <text class="sub" x="1048" y="596" text-anchor="middle">marionette board post</text>
      <text class="sub" x="1048" y="612" text-anchor="middle">--json post.json</text>

      <rect class="node" x="952" y="640" width="192" height="80" rx="6"/>
      <rect class="tag" x="960" y="648" width="56" height="12" rx="2"/>
      <text class="tag-text" x="988" y="657" text-anchor="middle">RESULT</text>
      <text class="name" x="1048" y="680" text-anchor="middle">Record evidence</text>
      <text class="sub" x="1048" y="696" text-anchor="middle">marionette result record</text>
      <text class="sub" x="1048" y="712" text-anchor="middle">--json result.json</text>

      <text class="note" x="48" y="768">Wakeups are hints; workers prove attention by advancing their cursor or posting a reply.</text>
      <line x1="32" y1="788" x2="1168" y2="788" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
      <text class="legend" x="32" y="812">CORAL = PRIMARY HANDOFF</text>
      <text class="legend" x="280" y="812">COMMANDS USE JSON FILES FOR NESTED REQUESTS</text>
    </svg>
  </main>
</body>
</html>
