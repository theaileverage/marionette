name: Release verification
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate release tag and main ancestry
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile
      - run: npm run check
      - run: npm run test
      - run: npm run format:check
      - name: Build and test release artifact
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets
          node scripts/release.mjs smoke "release-assets/theaileverage-marionette-$(node -p 'require("./package.json").version').tgz"
