name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    name: Verify, publish, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Validate release tag and main ancestry
        run: |
          bun scripts/release.mjs check "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - name: Build and test release artifact
        run: |
          mkdir release-assets
          bun pm pack --destination release-assets
          bun scripts/release.mjs smoke "release-assets/theaileverage-marionette-$(bun -p 'require("./package.json").version').tgz"
      - name: Use a supported npm trusted-publishing client
        run: npm install --global npm@11.19.1
      - name: Publish through npm OIDC and verify registry integrity
        run: bun scripts/release.mjs publish release-assets
      - name: Create GitHub release with verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.mjs github release-assets
