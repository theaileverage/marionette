name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm run check
      - run: npm run test
      - run: npm run boundaries:check
      - run: npm run package:smoke
      - run: npm run format:check
      - run: npm run release:check
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: node scripts/release.mjs smoke "$RUNNER_TEMP/theaileverage-marionette-$(node -p 'require("./package.json").version').tgz"
  required:
    name: Required CI
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
